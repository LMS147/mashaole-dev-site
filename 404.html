<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090e">
<title>404 — Page Not Found | Mashaole Letsoalo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; background: #07090e; color: #eef1f7; font-family: system-ui, sans-serif; }
a { color: inherit; }
.shell { width: min(1120px, 100% - 40px); margin: auto; }
header { padding: 28px 0; border-bottom: 1px solid #242c38; }
.brand { text-decoration: none; font: 700 17px ui-monospace, monospace; }
.brand span, .eyebrow { color: #00e5ff; }
main { padding: clamp(36px, 7vh, 80px) 0 40px; text-align: center; }
.eyebrow { font: 600 12px ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
.scene { display: grid; grid-template-columns: 1fr 1.25fr 1fr; align-items: center; gap: 24px; margin: 24px 0 0; }
figure { margin: 0; border: 1px solid #293342; border-radius: 22px; overflow: hidden; background: #101722; transform: rotate(-4deg); }
figure:last-child { transform: rotate(4deg); }
figure img { display: block; width: 100%; height: clamp(200px, 30vw, 340px); object-fit: cover; object-position: center 25%; }
figcaption { padding: 13px 8px; font: 12px ui-monospace, monospace; color: #a8b0c0; }
.code { font: 800 clamp(72px, 12vw, 156px)/1 ui-monospace, monospace; letter-spacing: -.08em; color: #00e5ff; text-shadow: 0 0 60px #00e5ff25; padding-right: .08em; }
h1 { font-size: clamp(25px, 3vw, 38px); letter-spacing: -.04em; line-height: 1.15; margin: 22px 0 14px; }
.message { color: #a8b0c0; line-height: 1.7; max-width: 440px; margin: 0 auto; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 32px 0 22px; }
.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 24px; border-radius: 8px; border: 1px solid #00e5ff; text-decoration: none; font-weight: 650; background: #00e5ff; color: #07090e; }
.secondary { background: transparent; color: #eef1f7; border-color: #455267; }
.button:hover { filter: brightness(1.15); }
a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
.hint { color: #a8b0c0; font-size: 13px; line-height: 1.7; }
footer { text-align: center; padding: 24px 0 32px; color: #a8b0c0; font: 12px/1.8 ui-monospace, monospace; }
@media (max-width: 650px) {
.scene { grid-template-columns: 1fr 1fr; gap: 16px; }
.copy { grid-column: 1 / -1; grid-row: 1; margin-bottom: 12px; }
figure img { height: clamp(190px, 48vw, 280px); }
figcaption { font-size: 11px; }
.code { font-size: 88px; }
.shell { width: calc(100% - 32px); }
main { padding-top: 30px; }
}
</style>
</head>
<body>
<header><div class="shell"><a class="brand" href="/" aria-label="Mashaole Letsoalo home">ML<span>.</span> / Software Developer</a></div></header>
<main class="shell">
<p class="eyebrow">Looks like we took a wrong turn</p>
<div class="scene">
<figure>
<img src="/images/character-casual.png" alt="Illustrated character in a black hoodie and headphones, checking a phone." width="1086" height="1448">
<figcaption>“Let me check the route…”</figcaption>
</figure>
<div class="copy">
<div class="code" aria-hidden="true">404</div>
<h1>Page not found.</h1>
<p class="message">Even the team couldn't find this one. The link may be incorrect, or the page may have moved.</p>
</div>
<figure>
<img src="/images/character-formal.png" alt="Illustrated character in a white shirt and black tie, ready to help." width="1254" height="1254">
<figcaption>“Let's get you back home.”</figcaption>
</figure>
</div>
<nav class="actions" aria-label="Page recovery">
<a class="button" href="/">Back to home <span aria-hidden="true">&nbsp;↗</span></a>
<a class="button secondary" href="/#contact">Contact me</a>
</nav>
<p class="hint">Looking for my work? <a href="/#projects">Explore my projects</a>.</p>
</main>
<footer class="shell">Mashaole Letsoalo · Software Developer</footer>
</body>
</html>
