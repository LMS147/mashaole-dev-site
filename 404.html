<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090e">
<title>404 — Page Not Found | Mashaole Letsoalo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; --accent: #00d5ff; --bg: #07090e; --text: #f3f2ef; --muted: #a8b0c0; }
body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
.skip { position: absolute; left: 20px; top: -100px; padding: 12px; background: var(--bg); z-index: 2; }
.skip:focus { top: 12px; }
header { border-bottom: 1px solid #ffffff0d; }
nav { max-width: 1440px; margin: auto; min-height: 88px; padding: 20px clamp(24px, 4vw, 64px); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { font: 800 19px ui-monospace, monospace; letter-spacing: -.04em; white-space: nowrap; }
.logo span { color: var(--accent); }
.nav-links { display: flex; gap: clamp(16px, 2.5vw, 36px); align-items: center; font: 12px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav-links a { padding: 10px 0; }
.nav-links a:hover { color: var(--accent); }
.hire { padding: 13px 20px; background: var(--accent); color: var(--bg); border-radius: 4px; font: 700 11px ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
main { width: min(1440px, 100%); margin: auto; padding: 50px clamp(24px, 4vw, 64px); min-height: calc(100svh - 150px); display: grid; grid-template-columns: .9fr 1.1fr; align-items: center; gap: clamp(24px, 3vw, 48px); }
.copy { position: relative; z-index: 1; padding: 24px 0; }
.eyebrow { color: var(--accent); font: 600 12px ui-monospace, monospace; letter-spacing: .15em; text-transform: uppercase; margin: 0 0 26px; }
h1 { margin: 0; font-family: Impact, "Arial Narrow", "Helvetica Neue", sans-serif; font-size: clamp(42px, 5.3vw, 84px); font-weight: 900; line-height: 1.04; letter-spacing: -.035em; text-transform: uppercase; }
h1 span { display: block; color: var(--accent); margin-top: 6px; }
.description { max-width: 420px; color: var(--muted); font-size: 15px; line-height: 1.85; margin: 26px 0 30px; }
.actions { display: flex; gap: 14px; flex-wrap: wrap; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 16px; min-height: 48px; padding: 16px 24px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); border-radius: 3px; font: 700 11px ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
.button.secondary { border-color: #ffffff38; color: var(--text); background: transparent; }
.button:hover { filter: brightness(1.15); }
.button.secondary:hover { border-color: var(--accent); color: var(--accent); }
.art { margin: 0; width: 100%; }
.art img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 10px; }
footer { padding: 18px 24px 24px; text-align: center; color: var(--muted); font: 11px/1.8 ui-monospace, monospace; }
@media (min-width: 1600px) { main { gap: 60px; } }
@media (max-width: 900px) { .nav-links { gap: 18px; } .nav-links a:nth-child(3) { display: none; } main { grid-template-columns: 1fr 1fr; padding-top: 36px; padding-bottom: 36px; } }
@media (max-width: 650px) {
nav { min-height: 76px; padding: 18px 20px; gap: 12px; }
.logo { font-size: 15px; }
.nav-links { display: none; }
.hire { padding: 12px 14px; font-size: 10px; }
main { grid-template-columns: 1fr; gap: 16px; padding: 28px 20px 36px; }
.copy { padding: 12px 0 8px; text-align: center; }
.eyebrow { margin-bottom: 18px; font-size: 11px; }
h1 { font-size: clamp(39px, 10vw, 64px); }
.description { margin: 22px auto 24px; font-size: 14px; }
.actions { justify-content: center; gap: 10px; }
.button { padding: 15px 18px; }
.art { max-width: 460px; justify-self: center; }
}
</style>
</head>
<body>

<p class="description">The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>

</body>
</html>
